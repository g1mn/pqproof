pacity:1}}.r17{animation-name:s17}@keyframes s17{0%,68.872%{opacity:0}68.882%,100%{opacity:1}}</style><rect width="960" height="472" rx="10" fill="#0B1220"/><rect width="960" height="32" rx="10" fill="#121C2E"/><rect y="22" width="960" height="10" fill="#121C2E"/><circle cx="20" cy="16" r="5" fill="#FF5F57"/><circle cx="38" cy="16" r="5" fill="#FEBC2E"/><circle cx="56" cy="16" r="5" fill="#28C840"/><text class="l r0" x="24" y="52"><tspan class="p">$ </tspan>pip install pqproof</text><text class="l r1 dim" x="24" y="74">Successfully installed pqproof-0.7.0</text><text class="l r2" x="24" y="96"><tspan class="p">$ </tspan>ex=$(pqproof examples)        # bundled before and after trees</text><text class="l r3" x="24" y="118"><tspan class="p">$ </tspan>pqproof &quot;$ex/classic&quot; &quot;$ex/pqc&quot;</text><text class="l r4 " x="24" y="140">== PQ-Proof 0.7.0</text><text class="l r5 " x="24" y="162">바뀐 파일: 추가 0 · 삭제 0 · 수정 5</text><text class="l r6 ok" x="24" y="184">[a-input] 통과  공통 파일 6/6 · 원본 막는 위치 13 · 원본 공개키 code 17</text><text class="l r7 ok" x="24" y="206">[a-cbom] 통과  막는 위치 0곳(원본 13)</text><text class="l r8 ok" x="24" y="228">[b-weakening] 통과  deny 0 · 본 파일 5</text><text class="l r9 dim" x="24" y="250">[b-tls] 해당 없음  TLS 서버·클라이언트 신호 0</text><text class="l r10 ok" x="24" y="272">[c-classic] 통과  공개키 code 0(원본 17) · 보안레벨 3 미만 0</text><text class="l r11 ok" x="24" y="294">[c-expect] 통과  E-MLKEM768 2 · E-MLDSA65 2</text><text class="l r12 ok" x="24" y="316">[r-review] 통과  0건</text><text class="l r13 dim" x="24" y="338">[r-allow] 해당 없음  허용 목록 없음</text><text class="l r14 ok" x="24" y="360">VERDICT=PASS  receipt_id=a6ffd732d634...</text><text class="l r15" x="24" y="382"><tspan class="p">$ </tspan>pqproof --verify proof-out-20261122-212241</text><text class="l r16 " x="24" y="404">all checks pass (37 checks)</text><text class="l r17 dim" x="24" y="426">evidence intact; the verdict it records: pass</text></svg>
