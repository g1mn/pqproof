# OpenSSF Scorecard: 저장소의 공급망 보안 점수. 결과는 code scanning(SARIF)과 scorecard.dev(publish_results, README 배지)로 간다.
# Scorecard 규칙: 워크플로 수준 쓰기 권한 없음, id-token·security-events 쓰기는 이 작업에만, 단계는 허용된 액션만(checkout·scorecard·upload-sarif).
# 액션은 커밋 해시로 고정한다(나온 지 2주 넘은 판). Dependabot 이 새 판을 제안한다.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  # GitHub 예약 실행은 건너뛰어질 수 있어, 저장소 설정만 바꾼 뒤에도 손으로 다시 잴 수 있게 둔다
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5  # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          sarif_file: results.sarif
