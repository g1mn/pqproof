# ClusterFuzzLite: fuzz the parsers that read files from other people (tests/fuzz/, built by .clusterfuzzlite/).
# Pull requests that touch them get a short run on the changed code; a weekly batch run fuzzes longer.
name: ClusterFuzzLite
on:
  pull_request:
    paths: [pqlite/**, tests/fuzz/**, .clusterfuzzlite/**, .github/workflows/cflite.yml]
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fuzz:
    name: fuzz (address)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1  # v1
        with:
          language: python
          sanitizer: address
          github-token: ${{ github.token }}
      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1  # v1
        with:
          github-token: ${{ github.token }}
          sanitizer: address
          mode: ${{ github.event_name == 'pull_request' && 'code-change' || 'batch' }}
          fuzz-seconds: ${{ github.event_name == 'pull_request' && 120 || 600 }}
          output-sarif: false
