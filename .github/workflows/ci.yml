# CI: 단위·셀프·변이 시험을 ubuntu·macOS × Python 3.9~3.14 에서 돌린다. tls_probe 는 Go 로 빌드해서 TLS 시험까지 돈다.
# 건너뛴 시험은 통과로 세지 않는다: 단위·셀프 시험은 STRICT=1 로 돌려 건너뛴 것이 하나라도 있으면 실패한다
# (CI 는 tls_probe·openssl·jsonschema·SARIF 스키마, 그리고 i-nist 실측용 pq-verify 와 ML-KEM 라이브러리 둘을 모두 넣는다).
# OpenSSL 3.5 미만: ubuntu-latest 의 OpenSSL 3.0 이 그 경우다(TLS 교차 확인은 '교차 확인 불가'로 적힌다). macOS 는 Homebrew
# OpenSSL 3.5 이상으로 돌고, 따로 LibreSSL(맥 기본 /usr/bin/openssl)로 단위 시험을 한 번 더 돈다.
# 판정 고정 기록: 변이 시험의 트리 항목(예제 대조군 포함)은 tests/golden/verdicts.json 과 판정·검사 칸·숫자가 같아야 한다.
# 버전 정책: 판정이 바뀌는 변경은 PATCH 로 낼 수 없다. version-policy 작업이 tests/version_policy.py 로 ruleset.json·CHANGELOG 와
# 마지막 릴리스 태그를 대조한다(버전이 그대로면 다음 릴리스가 MINOR 여야 하는지 알림만).
# 린트: ruff(오류 계열 F·E9·B), shellcheck(셸 파일 여섯, 규칙 파일과 시험용 라이브러리 빌드 스크립트 둘 포함), zizmor(워크플로·액션 보안 점검). 도구는
# .github/requirements/lint.txt 에 해시로 고정한다. Windows 칸은 bash 없이 증적 재검증만 돈다.
# 릴리스 워크플로(release.yml)가 이 파일을 workflow_call 로 그대로 부른다: 릴리스도 이 칸 전부를 통과해야 나간다.
# 액션은 모두 커밋 SHA 로 고정한다(주석은 그 SHA 의 태그). Dependabot 이 갱신 PR 을 연다(.github/dependabot.yml).
name: CI

# 사이트(docs/)와 Pages 워크플로만 바뀐 push 는 CI 를 돌리지 않는다(코드가 같아 결과가 같고, 연달아 올리면 앞 실행이 취소돼 배지가 실패로 보인다)
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '.github/workflows/pages.yml']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash  # bash --noprofile --norc -eo pipefail

env:
  PYTHONDONTWRITEBYTECODE: "1"  # 작업 폴더에 __pycache__ 가 생겨 휠에 섞이지 않게
  # OASIS SARIF 2.1.0 errata01 OS 스키마. 내려받은 뒤 SHA-256 을 맞춰야 쓴다
  SARIF_SCHEMA_URL: https://docs.oasis-open.org/sarif/sarif/v2.1.0/errata01/os/schemas/sarif-schema-2.1.0.json
  SARIF_SCHEMA_SHA256: c3b4bb2d6093897483348925aaa73af03b3e3f4bd4ca38cef26dcb4212a2682e
  # CycloneDX 1.6.2 스키마 셋(tests/test_cdx.py 의 CBOM 내보내기 검증, 0.7.0). 내려받은 뒤 SHA-256 을 맞춰야 쓴다
  CDX_SCHEMA_BASE: https://raw.githubusercontent.com/CycloneDX/specification/1.6.2/schema
  CDX_BOM_SHA256: 18f57f7482593bad9f21b4feed09084640cbeff419d62ad5090c5ceccca5b37d
  CDX_SPDX_SHA256: c41917196639055e9f9670811bac23ef777732144f3ff5a2f39686f61580dbe6
  CDX_JSF_SHA256: 8bae002c25e723db7ee1f26afde680ae1a2b1a8f6b4b4b0fd65dc3becb090aae

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        # ubuntu-latest(26.04)에는 setup-python 의 3.9 빌드가 없어 3.9 만 24.04 에서 돈다
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: probe/go.mod
          cache: false

      - name: Tool versions
        run: |
          bash --version | head -1
          python3 --version
          go version
          openssl version || true
          for o in /opt/homebrew/opt/openssl@3.5/bin/openssl /opt/homebrew/opt/openssl@3/bin/openssl; do [ -x "$o" ] && "$o" version; done || true
          (command -v keytool && keytool -help 2>&1 | head -1) || echo "keytool: none"
          bash prove.sh --version

      - name: Static checks
        run: |
          python3 - <<'EOF'
          import ast, pathlib
          files = [pathlib.Path("prove.py"), *pathlib.Path("pqlite").glob("*.py"), *pathlib.Path("src").rglob("*.py"),
                   *pathlib.Path("tests").rglob("*.py")]
          for f in files:
              ast.parse(f.read_text(encoding="utf-8"), str(f))
          print(len(files), "python files parse")
          EOF
          bash -n prove.sh build-probe.sh scan/cbom-scan.sh scan/residue.sh

      - name: Build tls_probe (offline, Go standard library only)
        run: bash build-probe.sh

      - name: go vet (probe)
        run: go vet -C probe ./...

      - name: gofmt (probe)
        run: |
          out="$(gofmt -l probe)"
          [ -z "$out" ] || { echo "gofmt 로 맞추지 않은 파일:"; echo "$out"; exit 1; }

      - name: tls_probe tests and fuzz seeds (offline)
        run: GOPROXY=off GOTOOLCHAIN=local go test -C probe ./...

      - name: SARIF schema and jsonschema
        run: |
          python3 -m pip install --quiet --require-hashes -r .github/requirements/schema.txt
          curl -sSfL -o "$RUNNER_TEMP/sarif-schema.json" "$SARIF_SCHEMA_URL"
          echo "$SARIF_SCHEMA_SHA256  $RUNNER_TEMP/sarif-schema.json" | shasum -a 256 -c -
          echo "SARIF_SCHEMA=$RUNNER_TEMP/sarif-schema.json" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/cdx-1.6"
          for f in bom-1.6.schema.json spdx.schema.json jsf-0.82.schema.json; do curl -sSfL -o "$RUNNER_TEMP/cdx-1.6/$f" "$CDX_SCHEMA_BASE/$f"; done
          printf '%s  %s\n' "$CDX_BOM_SHA256" "$RUNNER_TEMP/cdx-1.6/bom-1.6.schema.json" "$CDX_SPDX_SHA256" "$RUNNER_TEMP/cdx-1.6/spdx.schema.json" \
            "$CDX_JSF_SHA256" "$RUNNER_TEMP/cdx-1.6/jsf-0.82.schema.json" | shasum -a 256 -c -
          echo "CDX_SCHEMA_DIR=$RUNNER_TEMP/cdx-1.6" >> "$GITHUB_ENV"

      - name: pq-verify (hash-pinned, no extras) and two ML-KEM-768 libraries for the live i-nist test
        # tests/test_pqverify.py Live 가 쓴다(PQ-Proof 런타임 의존이 아니다). 라이브러리는 mlkem-native 고정 커밋을 SHA-256 으로 맞춰 빌드한다
        run: |
          python3 -m venv "$RUNNER_TEMP/pqv"
          "$RUNNER_TEMP/pqv/bin/python" -m pip install --quiet --no-deps --only-binary=:all: --require-hashes -r .github/requirements/pq-verify.txt
          "$RUNNER_TEMP/pqv/bin/pq-verify" --version
          bash tests/pqverify_targets.sh "$RUNNER_TEMP/pqv-targets" | tee -a "$GITHUB_ENV"
          echo "PQ_VERIFY=$RUNNER_TEMP/pqv/bin/pq-verify" >> "$GITHUB_ENV"

      - name: Unit tests (no skips allowed)
        run: STRICT=1 bash prove.sh --unit 2>&1 | tee unit.log

      - name: Unit tests with LibreSSL (OpenSSL below 3.5, macOS only)
        if: runner.os == 'macOS'
        run: OPENSSL=/usr/bin/openssl STRICT=1 bash prove.sh --unit 2>&1 | tee unit-libressl.log

      - name: Self-test (no skipped cases allowed)
        run: |
          mkdir -p "$RUNNER_TEMP/selftest"
          STRICT=1 SELFTEST_DIR="$RUNNER_TEMP/selftest" bash prove.sh --selftest 2>&1 | tee selftest.log
          # S6a 의 OpenSSL 교차 확인은 3.5 이상에서만 돈다. 안 돈 것이 통과로 섞이지 않게 증적에서 확인한다:
          # macOS(Homebrew 3.5 이상)는 교차 확인이 돌아 일치해야 하고, 3.5 미만(ubuntu-latest 3.0)은 '교차 확인 불가'로 적혀야 한다
          python3 - "$RUNNER_TEMP/selftest/s6a/receipt.json" "$RUNNER_OS" <<'EOF'
          import json, sys
          t = json.load(open(sys.argv[1], encoding="utf-8"))["tls"]["targets"][0]
          agrees, note = t["openssl_agrees"], t.get("openssl_note", "")
          print(f"S6a OpenSSL cross-check: openssl_agrees={agrees} {note}")
          if sys.argv[2] == "macOS":
              assert agrees is True, "macOS must run the OpenSSL 3.5 cross-check in S6a"
          else:
              assert agrees is True or (agrees is None and note.startswith("교차 확인 불가")), t
          EOF
          # S6f: CA·#tofu 없는 대상은 system 신뢰로 재고, macOS 의 OpenSSL 교차 확인도 같은 시험 CA 를 기본 경로에서 못 찾아 검증 실패여야 한다
          python3 - "$RUNNER_TEMP/selftest/s6f/receipt.json" "$RUNNER_OS" <<'EOF'
          import json, sys
          t = json.load(open(sys.argv[1], encoding="utf-8"))["tls"]["targets"][0]
          o = t["openssl"]
          print(f"S6f trust={t['trust']} openssl={o and o.get('error')} {t.get('openssl_note', '')}")
          assert t["trust"] == "system", t
          if sys.argv[2] == "macOS":
              assert o is not None and not o["ok"] and o["error"].startswith("certificate verification failed: "), t
          else:
              assert o is None or (not o["ok"] and o["error"].startswith("certificate verification failed: ")), t
          EOF

      - name: Mutation suite and golden verdicts (every planted defect caught, no verdict moved)
        run: python3 -I tests/mutations/run_mutations.py --strict --golden tests/golden/verdicts.json --json mutations-result.json

      - name: Mutation runner self-check (wrong expectation FAIL, stale fixture SKIP, exit 1)
        run: |
          set +e
          python3 -I tests/mutations/run_mutations.py --spec tests/mutations/selfcheck.json --no-sarif --json selfcheck-result.json
          code=$?
          set -e
          python3 - "$code" <<'EOF'
          import json, sys
          c = json.load(open("selfcheck-result.json"))["counts"]
          want = {"PASS": 0, "FAIL": 1, "SKIP": 1, "PENDING": 1}
          assert int(sys.argv[1]) == 1, f"runner exit {sys.argv[1]}, want 1"
          assert c == want, f"{c} != {want}"
          print("runner self-check ok", c)
          EOF

      - name: Package install and console command
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet .
          P="$RUNNER_TEMP/venv/bin/pqproof"
          test "$("$P" --version)" = "$(bash prove.sh --version)"
          PROBE_BIN_DIR="$PWD/bin" "$P" doctor
          code=0
          OUT="$RUNNER_TEMP/pkg-pass" "$P" examples/classic examples/pqc || code=$?
          test "$code" -eq 0
          code=0
          OUT="$RUNNER_TEMP/pkg-fail" "$P" examples/classic examples/classic || code=$?
          test "$code" -eq 1
          "$P" --verify "$RUNNER_TEMP/pkg-pass"
          "$P" --verify tests/golden/evidence/f1-public-a
          "$P" sarif "$RUNNER_TEMP/pkg-fail" -o "$RUNNER_TEMP/pkg-fail.sarif"
          python3 - "$RUNNER_TEMP/pkg-fail.sarif" <<'EOF'
          import json, os, sys, jsonschema
          doc = json.load(open(sys.argv[1]))
          schema = json.load(open(os.environ["SARIF_SCHEMA"]))
          jsonschema.validators.validator_for(schema)(schema).validate(doc)
          assert doc["runs"][0]["results"], "classic -> classic must give SARIF results"
          print("SARIF ok:", len(doc["runs"][0]["results"]), "results")
          EOF

      - name: Scanner self-test (cbom-scan.sh, in a copy so generated keys stay out of the checkout)
        run: |
          cp -R . "$RUNNER_TEMP/scan-copy"
          if [ "$RUNNER_OS" = macOS ]; then OPENSSL="$(brew --prefix openssl@3)/bin/openssl"; export OPENSSL; fi
          (cd "$RUNNER_TEMP/scan-copy" && bash scan/cbom-scan.sh --selftest) 2>&1 | tee scanner.log
          # cbom-scan.sh --selftest 는 도구가 없어 못 돈 단언을 SKIP 으로 세고 전체 단언 수와 함께 찍는다('PASS n · FAIL m · SKIP k of t').
          # 건너뛴 단언은 통과로 세지 않는다. 허용하는 건너뜀은 OpenSSL 3.5 미만(ubuntu-latest 3.0)의 ML-KEM·ML-DSA 4개뿐이다
          # (ML-DSA-65 인증서·ML-KEM-768 키 2, ML-KEM TLS 서버 2). macOS 는 Homebrew OpenSSL 3.5 이상이라 0개여야 한다.
          # ssh-keygen·keytool·Ed25519 가 없어 빠진 단언(7개)은 러너에 있어야 하는 도구라 실패로 본다
          python3 - scanner.log "$RUNNER_OS" <<'EOF'
          import re, sys
          text = open(sys.argv[1], encoding="utf-8").read()
          m = re.search(r"^selftest: PASS (\d+) · FAIL (\d+) · SKIP (\d+) of (\d+) \(OpenSSL: (.*), ML-KEM ([01]), keytool (.*), ssh-keygen (.*)\)$",
                        text, re.M)
          assert m, "cbom-scan.sh --selftest printed no summary line"
          passed, failed, skipped, total, mlkem = int(m[1]), int(m[2]), int(m[3]), int(m[4]), m[6] == "1"
          assert passed + failed + skipped == total, "the summary line does not add up"
          allowed = 0 if mlkem else 4
          print(f"scanner self-test: {passed} 통과 · {skipped} 건너뜀 · {failed} 실패 / {total} (건너뛴 것은 통과로 세지 않는다), "
                f"ML-KEM {int(mlkem)}, keytool {m[7]}, ssh-keygen {m[8]}, {m[5]}")
          assert failed == 0, f"{failed} scanner assertions failed"
          assert sys.argv[2] != "macOS" or mlkem, "macOS must run the ML-KEM assertions (Homebrew OpenSSL 3.5 or later)"
          assert skipped == allowed, f"{skipped} scanner assertions skipped, {allowed} allowed: ssh-keygen, keytool or Ed25519 is missing on this runner"
          EOF

      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: logs-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            unit.log
            unit-libressl.log
            selftest.log
            scanner.log
            mutations-result.json
            selfcheck-result.json
          if-no-files-found: ignore

  lint:
    name: lint (ruff, shellcheck, zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      - name: Lint tools (hash-pinned)
        run: python3 -m pip install --quiet --require-hashes -r .github/requirements/lint.txt

      - name: ruff (pycodestyle E and W, pyflakes, bugbear; settings in pyproject.toml)
        run: ruff check --no-cache .

      - name: shellcheck
        run: |
          shellcheck --version | head -2
          shellcheck prove.sh build-probe.sh tests/pqverify_targets.sh tests/kpqc_targets.sh
          # 두 스캐너는 규칙 묶음 파일이라 고치면 판정 해시가 바뀐다. style·info 정리는 다음 규칙 묶음 변경과 함께 한다(CONTRIBUTING.md, Changing a rule)
          shellcheck -S warning scan/residue.sh scan/cbom-scan.sh

      - name: zizmor (workflows, the action and the example workflows)
        run: zizmor --offline --min-severity medium .github/workflows/ action.yml examples/github-actions/pqproof-sarif.yml examples/github-actions/pqproof-check.yml

      - name: Schemas match the code
        run: python3 -I -B tests/make_schemas.py --check

  verify-windows:
    name: re-verify evidence on Windows (Python only, no bash)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      - name: Install, re-verify the golden evidence, convert to SARIF, refuse to judge
        shell: pwsh
        run: |
          python -m pip install --quiet .
          pqproof --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          foreach ($d in Get-ChildItem tests/golden/evidence -Directory) {
            pqproof --verify $d.FullName
            if ($LASTEXITCODE -ne 0) { Write-Error "verify failed: $($d.Name)"; exit 1 }
          }
          pqproof sarif tests/golden/evidence/f2-v0.1.0 -o golden.sarif
          if ($LASTEXITCODE -ne 0) { exit 1 }
          pqproof examples/classic examples/pqc
          if ($LASTEXITCODE -ne 2) { Write-Error "judging on Windows must stop with exit 2 and the WSL note"; exit 1 }
          exit 0

  version-policy:
    name: version policy (no verdict change in a PATCH release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # 마지막 릴리스 태그와 비교한다

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      - name: Version policy against the latest release tag
        run: |
          base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          echo "latest release: ${base:-none}"
          python3 -I tests/version_policy.py ${base:+--base "$base"}

  action:
    name: composite action (action.yml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Pass case (classic -> pqc)
        id: pass
        uses: ./
        with:
          original: examples/classic
          converted: examples/pqc
          allow-list: none

      - name: Fail case (classic -> classic), gate off
        id: fail
        uses: ./
        with:
          original: examples/classic
          converted: examples/classic
          allow-list: none
          fail-on: never

      - name: Check outputs
        env:
          PASS_VERDICT: ${{ steps.pass.outputs.verdict }}
          PASS_HASH: ${{ steps.pass.outputs.evidence-hash }}
          FAIL_VERDICT: ${{ steps.fail.outputs.verdict }}
          FAIL_SARIF: ${{ steps.fail.outputs.sarif-file }}
        run: |
          test "$PASS_VERDICT" = pass
          [[ "$PASS_HASH" =~ ^[0-9a-f]{64}$ ]]
          test "$FAIL_VERDICT" = fail
          python3 - "$FAIL_SARIF" <<'EOF'
          import json, sys
          run = json.load(open(sys.argv[1]))["runs"][0]
          rules = {r["ruleId"] for r in run["results"]}
          assert {"a-cbom", "c-classic"} <= rules, rules
          uris = {r["locations"][0]["physicalLocation"]["artifactLocation"]["uri"] for r in run["results"]}
          assert all(u.startswith("examples/classic/") for u in uris), uris
          print("action ok:", len(run["results"]), "results")
          EOF
