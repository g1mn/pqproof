# GitHub Pages: docs/ 를 그대로 배포한다(사이트는 docs/index.html 한 파일과 docs/assets/). 배포 전에 사이트가 지금 판으로 만들어졌는지 본다.
# 저장소 Settings > Pages > Source 를 GitHub Actions 로 둔다. 액션은 커밋 SHA 로 고정한다(주석은 태그).
name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Site matches the package version
        # ci.yml 은 docs/** 만 바뀐 push 를 돌리지 않으므로, 판·규칙 묶음·증적 형식·KAT 목록과 다른 사이트는 여기서 배포를 멈춘다
        run: python3 -I tests/version_policy.py --site-only
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: 'docs'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
