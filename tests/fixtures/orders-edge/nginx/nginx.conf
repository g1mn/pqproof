# Edge for the orders API: TLS termination on 8443, proxied to the API over TLS.
worker_processes 1;
error_log stderr warn;
pid /run/orders-edge-nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log off;

    server {
        listen 8443 ssl;
        server_name orders-edge.local;

        ssl_certificate     /etc/orders-edge/tls/cert.pem;
        ssl_certificate_key /etc/orders-edge/tls/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        # Pinned to P-256 by the 2023 compliance review.
        ssl_ecdh_curve      prime256v1;

        location / {
            proxy_pass https://127.0.0.1:9443;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/orders-edge/tls/ca.pem;
            proxy_ssl_name orders-api.internal;
            proxy_ssl_server_name on;
        }
    }
}
