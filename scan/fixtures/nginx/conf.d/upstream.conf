location /api/ {
    proxy_pass https://backend.internal;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384;
    proxy_ssl_conf_command Groups X25519MLKEM768;
}
location /grpc/ {
    grpc_pass grpcs://backend.internal:50051;
    grpc_ssl_protocols TLSv1.2;
}
