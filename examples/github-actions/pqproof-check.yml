# 예시: 전환이 끝난 저장소의 회귀 방지. main 에 들어간 커밋과 매주 한 번, 원본 없이 지금 트리만 판정한다(pqproof check).
# 전환 PR 은 같은 폴더의 pqproof-sarif.yml(원본과 전환본을 같이 판정)을 쓴다. 이 파일은 고전 공개키 코드가 다시 들어오거나,
# 허용 항목이 만료되거나(expires_at), 사람 확인이 오래된(REVIEW_MAX_AGE_DAYS) 때를 잡는다.
# check 는 TLS 약화(b-weakening)와 검증 호출 제거(r-review)를 보지 않는다. PR 에서는 pqproof-sarif.yml 의 두 트리 판정을 그대로 둔다.
# pqproof 0.2.0 부터 있는 명령이다. 버전을 올릴 때 아래 고정 버전을 같이 바꾼다.
name: PQC regression check

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  pqproof-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install PQ-Proof
        run: python3 -m pip install --user "pqproof==0.4.1"

      - name: PQ-Proof check (one tree)
        env:
          ALLOW: notes/unconverted.json   # 없으면 none 으로 바꾼다
          REQUIRE_REVIEW: "1"
          REVIEW_MAX_AGE_DAYS: "365"
          FAIL_ON_REVIEW: "1"             # 통과여도 검토 필요인 검사가 있으면 종료 5 로 멈춘다
          OUT: ${{ runner.temp }}/pqproof-check
        run: pqproof check .

      - name: Keep the evidence folder
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pqproof-check
          path: ${{ runner.temp }}/pqproof-check
