# 예시: PR 마다 기준 브랜치(원본)와 PR 결과(전환본)를 PQ-Proof 로 판정하고, 남은 고전 공개키 위치를
# GitHub code scanning 경고(SARIF)로 올린다. 검증 증적 폴더는 작업 산출물로 남긴다.
# 이 파일을 쓰는 저장소의 .github/workflows/ 에 복사한다. 같은 저장소 PR 에서 SARIF 를 올릴 수 있다
# (포크 PR 은 GITHUB_TOKEN 이 읽기 전용이라 upload-sarif 가 막힌다).
# 허용 목록은 기준 커밋의 사본을 쓴다: PR 작성자가 허용 항목과 사람 확인 칸(reviewed_by·reviewed_at)을 같은 PR 에서 함께 고쳐
# 통과시키지 못하게. 허용 목록을 바꾸는 PR 은 경고가 뜨고, 바뀐 목록은 병합된 뒤에야 쓰인다. 목록 경로는 CODEOWNERS 로
# 보안 담당 승인을 받게 둔다(같은 폴더 CODEOWNERS.example).
# g1mn/pqproof 는 릴리스 태그의 커밋 SHA 로 고정했다(판은 uses 줄 주석). 새 릴리스로 올릴 때 SHA 와 주석을 같이 바꾸고, 받은 휠은
# `gh attestation verify <파일> --repo g1mn/pqproof` 로 확인할 수 있다.
name: PQC migration check

on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  pqproof:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read           # 비공개 저장소의 upload-sarif 에 필요하다
      security-events: write  # upload-sarif
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Original tree and allowlist from the base commit (outside the workspace, no .git inside)
        id: base
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          LIST: notes/unconverted.json
        run: |
          # git archive 는 .gitattributes 의 export-ignore 경로를 빼서, 바뀌지 않은 파일이 '추가된 파일'로 보였다
          GIT_INDEX_FILE="$RUNNER_TEMP/base.idx" git read-tree "$BASE"
          GIT_INDEX_FILE="$RUNNER_TEMP/base.idx" git checkout-index -a --prefix="$RUNNER_TEMP/original/"
          if git cat-file -e "$BASE:$LIST" 2>/dev/null; then
            git show "$BASE:$LIST" > "$RUNNER_TEMP/unconverted.json"
            echo "allow=$RUNNER_TEMP/unconverted.json" >> "$GITHUB_OUTPUT"
          else
            echo "allow=none" >> "$GITHUB_OUTPUT"
          fi
          if ! git diff --quiet "$BASE" HEAD -- "$LIST"; then
            echo "::warning file=$LIST::This PR changes the allowlist. The check uses the base copy; the new entries apply after a security owner approves and merges them."
          fi

      - name: PQ-Proof
        id: pqproof
        uses: g1mn/pqproof@f5ab8885e6917e0c22c8bdba67593d297457184d  # v0.7.0
        with:
          original: ${{ runner.temp }}/original
          converted: .
          allow-list: ${{ steps.base.outputs.allow }}
          require-review: true                 # 허용 항목마다 사람 확인(reviewed_by·reviewed_at)
          sarif-anchor: notes/unconverted.json # 위치 없는 검사(c-expect 등)를 이 파일 1행에 붙인다

      - name: Upload SARIF to code scanning
        if: always() && steps.pqproof.outputs.sarif-file != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: ${{ steps.pqproof.outputs.sarif-file }}
          category: pqproof

      - name: Keep the evidence folder
        if: always() && steps.pqproof.outputs.output-dir != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pqproof-evidence
          path: ${{ steps.pqproof.outputs.output-dir }}
