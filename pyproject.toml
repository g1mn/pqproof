# PQ-Proof 파이썬 패키지. 판정 코드(prove.sh·prove.py·pqlite/·scan/)는 저장소 루트에 그대로 두고, 휠을 만들 때
# pqproof/_tool/ 아래로 옮겨 담는다(force-include). 그래서 `bash prove.sh` 와 `pqproof` 가 같은 파일을 돈다.
# 런타임 파이썬 의존은 없다. 바깥 의존은 bash·openssl(필수), keytool·tls_probe(선택)이고 pqproof 가 실행 때 점검한다.
# 배포는 .github/workflows/release.yml(태그 v*)에서 PyPI Trusted Publishing 으로 한다. 토큰을 저장하지 않는다.
# 버전은 src/pqproof/__init__.py 의 __version__ 한 곳에서만 정한다(dynamic). prove.sh --version 도 같은 곳을 읽는다.

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pqproof"
dynamic = ["version"]
description = "Offline check that a PQC migration is complete: the original and the converted tree are judged by the same rules, with a hashed evidence record (RFC 8785 + SHA-256)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "g1mn" }]
keywords = ["post-quantum", "pqc", "ml-kem", "ml-dsa", "cbom", "tls", "migration", "evidence", "sarif"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Unix Shell",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://g1mn.github.io/pqproof/"
Source = "https://github.com/g1mn/pqproof"
Issues = "https://github.com/g1mn/pqproof/issues"
Changelog = "https://github.com/g1mn/pqproof/blob/main/CHANGELOG.md"

[project.scripts]
pqproof = "pqproof.cli:main"

[tool.hatch.version]
path = "src/pqproof/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pqproof"]

# 판정 코드와 셸 스캐너·예제·시험을 패키지 데이터로 담는다.
# 깨끗한 체크아웃에서 만든다(CI release.yml): __pycache__·bin/·proof-out-* 가 섞이지 않게.
[tool.hatch.build.targets.wheel.force-include]
"prove.sh" = "pqproof/_tool/prove.sh"
"prove.py" = "pqproof/_tool/prove.py"
"build-probe.sh" = "pqproof/_tool/build-probe.sh"
"pqlite" = "pqproof/_tool/pqlite"
"scan" = "pqproof/_tool/scan"
"schemas" = "pqproof/_tool/schemas"
"examples" = "pqproof/_tool/examples"
"tests" = "pqproof/_tool/tests"
"probe" = "pqproof/_tool/probe"
"LICENSE" = "pqproof/_tool/LICENSE"
"CHANGELOG.md" = "pqproof/_tool/CHANGELOG.md"

[tool.hatch.build.targets.sdist]
include = [
  "/prove.sh",
  "/prove.py",
  "/build-probe.sh",
  "/pqlite",
  "/scan",
  "/schemas",
  "/examples",
  "/tests",
  "/probe",
  "/src",
  "/action.yml",
  "/README.md",
  "/DESIGN.md",
  "/CHANGELOG.md",
  "/SECURITY.md",
  "/LICENSE",
  "/pyproject.toml",
]
exclude = ["**/__pycache__", "/bin", "/proof-out-*", "/scan/evidence", "/scan/fixtures/gen"]

# 린트(CI lint 작업): 오류 계열만 본다(F 이름·가져오기, E9 구문, B 흔한 버그). 고정물(일부러 틀린 코드)은 빼고,
# 규칙 파일 여섯(규칙 묶음 해시에 든다)의 지적은 다음 묶음 올림(ruleset 2)에서 함께 고친다.
[tool.ruff]
target-version = "py39"
extend-exclude = ["scan/fixtures", "tests/fixtures", "tests/golden/evidence", "docs"]

[tool.ruff.lint]
select = ["F", "E9", "B"]

[tool.ruff.lint.per-file-ignores]
"pqlite/allowlist.py" = ["F401"]
